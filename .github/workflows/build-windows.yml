name: Build Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'build_portable.bat'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build portable package
        shell: cmd
        run: build_portable.bat
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HushPhoto-Windows-Portable
          path: dist/HushPhoto-Windows-Portable.zip
          if-no-files-found: error
