name: Windows CI — tests and build verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'build_portable.bat'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'build_portable.bat'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: read
jobs:
  windows-ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Run tests and validate Windows executable build
        shell: cmd
        run: build_portable.bat --ci-check
      - name: Check CI did not create a portable download
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/HushPhoto/HushPhoto.exe')) { throw 'EXE build missing' }
          if (Test-Path 'dist/HushPhoto-Windows-Portable.zip') { throw 'CI must not package incomplete USB releases' }
          '### Windows CI passed' >> $env:GITHUB_STEP_SUMMARY
          'Tests and Windows executable compilation succeeded. No downloadable portable ZIP was created or published. A release for iPhone USB export requires verified compatible native AFC components and redistribution review.' >> $env:GITHUB_STEP_SUMMARY
