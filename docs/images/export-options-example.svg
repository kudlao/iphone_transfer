<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 497 610" width="497" height="610" role="img" aria-label="Hush Photo демонстрационные параметры экспорта"><rect width="497" height="610" fill="#f4f6f9"/><rect x="0" y="0" width="497" height="31" rx="0" fill="#fff" stroke="none"/><rect x="7" y="8" width="15" height="15" rx="4" fill="#0584fd" stroke="none"/><text x="28" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#12233a">Параметры экспорта</text><text x="471" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#12233a">×</text><text x="24" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#102038">Экспорт фотографий</text><text x="24" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#60708b">Оригиналы сохраняют исходное качество, HDR и метаданные.</text><text x="24" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#12233a">Формат</text><rect x="24" y="171" width="449" height="152" rx="13" fill="#fff" stroke="none"/><circle cx="50" cy="189" r="8" fill="#4097d5" stroke="#4097d5" stroke-width="2"/><circle cx="50" cy="189" r="3" fill="white"/><text x="66" y="194" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Оригиналы · без изменений</text><circle cx="50" cy="225" r="8" fill="none" stroke="#48515b" stroke-width="2"/><text x="66" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Оригиналы + JPEG</text><circle cx="50" cy="261" r="8" fill="none" stroke="#48515b" stroke-width="2"/><text x="66" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">JPEG · совместимая копия</text><circle cx="50" cy="297" r="8" fill="none" stroke="#48515b" stroke-width="2"/><text x="66" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">TIFF · максимальный размер</text><rect x="24" y="336" width="24" height="24" rx="5" fill="#4899d9" stroke="none"/><text x="30" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="white">✓</text><text x="54" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Сохранить движение Live Photos (MOV)</text><text x="24" y="403" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#102038">Организация файлов</text><rect x="24" y="420" width="449" height="39" rx="11" fill="#e9eef5" stroke="none"/><text x="35" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">По годам и месяцам</text><text x="450" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#12233a">⌄</text><text x="24" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b7591">При USB-экспорте оригинал сохраняется даже при выборе JPEG.</text><rect x="200" y="551" width="90" height="35" rx="9" fill="#edf1f6" stroke="none"/><text x="215" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Отмена</text><rect x="297" y="551" width="175" height="35" rx="9" fill="#087bfa" stroke="none"/><text x="312" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="white">Начать экспорт</text></svg>