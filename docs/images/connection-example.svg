<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1153 795" width="1153" height="795" role="img" aria-label="Hush Photo демонстрационный экран подключения"><rect width="1153" height="795" fill="#f4f6f9"/><rect x="0" y="0" width="1153" height="108" rx="0" fill="#ffffff" stroke="none"/><rect x="0" y="0" width="1153" height="30" rx="0" fill="#ffffff" stroke="none"/><rect x="7" y="7" width="15" height="15" rx="4" fill="#0584fd" stroke="none"/><text x="28" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Hush Photo</text><text x="30" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#087bfa">◉</text><text x="57" y="77" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#102038">Hush Photo</text><text x="57" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#60708b">Фото и видео — без облака и сжатия</text><text x="943" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#60708b">Локальный перенос · Windows</text><rect x="15" y="128" width="271" height="645" rx="18" fill="#fff" stroke="none"/><text x="34" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#102038">Устройство</text><text x="34" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e7790">Выберите источник файлов</text><rect x="34" y="235" width="236" height="36" rx="10" fill="#e9eef5" stroke="none"/><rect x="36" y="236" width="114" height="35" rx="9" fill="#087bfa" stroke="none"/><text x="51" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="white">iPhone</text><text x="193" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#12233a">Папка</text><rect x="34" y="287" width="236" height="85" rx="13" fill="#edf1f6" stroke="none"/><text x="48" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748b">●  Ожидаем iPhone</text><text x="48" y="346" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#12233a">Подключите iPhone по USB.</text><text x="48" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#12233a">Медиатека откроется автоматически.</text><text x="34" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#12233a">Сохранить в</text><rect x="34" y="466" width="236" height="41" rx="12" fill="#edf1f6" stroke="none"/><text x="49" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#12233a">Выбрать папку назначения  →</text><text x="35" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e7790">Папка ещё не выбрана</text><text x="35" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#74819a">Для доступа к iPhone разблокируйте</text><text x="35" y="739" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#74819a">его и нажмите «Доверять».</text><text x="35" y="754" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#74819a">Оригиналы остаются на устройстве.</text><text x="305" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#102038">Медиатека</text><text x="305" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e7890">Пока нет файлов</text><rect x="305" y="209" width="826" height="458" rx="18" fill="#fff" stroke="none"/><text x="704" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" fill="#087bfa">▧</text><text x="619" y="427" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#102038">Подключите iPhone</text><text x="543" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#74819a">Медиатека появится автоматически после подключения.</text><text x="584" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#74819a">Разблокируйте iPhone и подтвердите «Доверять».</text><rect x="618" y="499" width="205" height="35" rx="9" fill="#087bfa" stroke="none"/><text x="633" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="white">Проверить подключение</text><rect x="305" y="686" width="826" height="87" rx="16" fill="#fff" stroke="none"/><text x="324" y="716" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#102038">Готово к подключению</text><text x="324" y="745" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#6e7890">Выберите файлы для экспорта</text><rect x="936" y="707" width="184" height="35" rx="9" fill="#087bfa" stroke="none"/><text x="951" y="730" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="white">Экспортировать</text></svg>